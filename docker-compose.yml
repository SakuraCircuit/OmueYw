services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-hklist_root}"
      MYSQL_DATABASE: "${DB_DATABASE:-hklist}"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-hklist_root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-hklist}"
      DB_USERNAME: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-hklist_root}"
      HKLIST_ADMIN_PASSWORD: "${HKLIST_ADMIN_PASSWORD:-admin}"
      HKLIST_PARSE_PASSWORD: "${HKLIST_PARSE_PASSWORD:-admin}"
      APP_URL: "http://127.0.0.1:${APP_PORT:-8080}"

volumes:
  mysql-data:
